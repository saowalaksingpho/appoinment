<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการวันหยุดและวันที่เปิดให้จอง</title>
    <link rel="stylesheet" href="styles3.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 50%;
            margin: auto;
            background: #fff;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }

        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: red;
            color: white;
        }

        .list-container {
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>
<header class="header">
    <a href="index.html" style="text-decoration: none;">
        <div class="logo-container">
            <img src="../img/11.jpg" alt="logo" class="logo">
            <span class="store-name">คลินิกทันตกรรมแกรนด์สไมล์</span>
        </div>
    </a>
       <div class="header-user" id="username">Loading...</div>
</header>

<body>
    <div class="container">
        <h2>จัดการวันหยุดและวันที่เปิดให้จอง</h2>

        <h3>เพิ่มวันหยุด</h3>
        <input type="date" id="holidayDate">
        <button onclick="addHoliday()">เพิ่มวันหยุด</button>

        <h3>เพิ่มวันที่เปิดให้จอง</h3>
        <input type="date" id="bookingDate">
        <button onclick="addBookingDate()">เพิ่มวันที่เปิดให้จอง</button>

        <div class="list-container">
            <div>
                <h3>วันหยุด</h3>
                <ul id="holidayList"></ul>
            </div>
            <div>
                <h3>วันที่เปิดให้จอง</h3>
                <ul id="bookingList"></ul>
            </div>
        </div>
    </div>
<script>
$(document).ready(function () {
  loadProfile();
});
function loadProfile() {
  $.ajax({
    url: "http://localhost:3000/profile",
    method: "GET",
    headers: {
      Authorization: localStorage.getItem("token")
    },
    success: function(user) {
      $("#username").text(user.fullname); 
    },
    error: function(err) {
      console.error(err);
    }
  });
}</script>
