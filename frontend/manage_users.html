<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการข้อมูลผู้ใช้</title>
    <link rel="stylesheet" href="styles3.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<header class="header">
  <a href="index.html" style="text-decoration: none;"> 
  <div class="logo-container">
      <img src="../img/11.jpg" alt="logo" class="logo">
      <span class="store-name">คลินิกทันตกรรมแกรนด์สไมล์</span>
    </div> </a>
  <div class="header-user"> <span id="userName"></span></div> 
</header> 
<body>

<div class="container mt-5">
    <h2>จัดการข้อมูลผู้ใช้</h2>

    <button class="btn btn-success mb-3" onclick="openAddUserModal()">➕ เพิ่มผู้ใช้</button>

    <table id="userTable" class="display table table-striped">
        <thead>
            <tr>
                <th>#</th>
                <th>ชื่อ-สกุล</th>
                <th>เบอร์โทรศัพท์</th>
                <th>อีเมล</th>
                <th>บทบาท</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody>
            <!-- ดึงข้อมูลผู้ใช้จาก Backend -->
        </tbody>
    </table>
</div>

<!-- Modal เพิ่มผู้ใช้ -->
<div id="addUserModal" class="modal">
    <div class="modal-content">
        <h4>เพิ่มผู้ใช้</h4>
        <label>ชื่อ: <input type="text" id="name"></label>
        <label>อีเมล: <input type="email" id="email"></label>
        <label>บทบาท:
            <select id="role">
                <option value="admin">Admin</option>
                <option value="doctor">หมอ</option>
                <option value="staff">เจ้าหน้าที่</option>
            </select>
        </label>
        <button onclick="addUser()">บันทึก</button>
    </div>
</div>

<script>
$(document).ready(function() {
    loadUsers();
});

// โหลดรายชื่อผู้ใช้
function loadUsers() {
    $.get("/get_users", function(data) {
        let table = $("#userTable").DataTable();
        table.clear();
        data.users.forEach(user => {
            table.row.add([
                user.name,
                user.email,
                `<select onchange="updateRole('${user._id}', this.value)">
                    <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                    <option value="doctor" ${user.role === 'doctor' ? 'selected' : ''}>หมอ</option>
                    <option value="staff" ${user.role === 'staff' ? 'selected' : ''}>เจ้าหน้าที่</option>
                </select>`,
                `<button class="btn btn-danger" onclick="deleteUser('${user._id}')">ลบ</button>`
            ]).draw();
        });
    });
}

// เพิ่มผู้ใช้
function addUser() {
    let name = $("#name").val();
    let email = $("#email").val();
    let role = $("#role").val();
    
    $.post("/add_user", { name: name, email: email, role: role }, function(response) {
        alert(response.message);
        loadUsers();
    });
}

// อัปเดตบทบาท
function updateRole(userId, role) {
    $.post("/update_role", { userId: userId, role: role }, function(response) {
        alert(response.message);
    });
}

// ลบผู้ใช้
function deleteUser(userId) {
    if (confirm("ต้องการลบผู้ใช้นี้จริงหรือไม่?")) {
        $.post("/delete_user", { userId: userId }, function(response) {
            alert(response.message);
            loadUsers();
        });
    }
}
</script>

</body>
</html>
