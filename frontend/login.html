<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    background-color: #f7f4f4;
    }

    .login-container {
      width: 300px;
    }

    .login-container h3 {
      margin: 0 0 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      margin-left: 10px;
      background: #06803b;
      color: #fff;
      border: none;
      border-radius: 5px;
      /* cursor: pointer; */
  
    }

    .login-btn:hover {
      background-color: #6f7f6f;
    }

    .links {
      text-align: center;
      margin-top: 15px;
      margin-left: 10px;
    }

    .links a {
      color: #976e06;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    img {
      display: block;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 25px;
      width: 60%;
      border-radius: 50%;   
      object-fit: cover;    

    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="../img/11.jpg">
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="button" class="login-btn" onclick="login()">Login</button>
    </form>
    <div class="links">
      <a href="signup.html">Sign Up</a>
    </div>
  </div>

</body>

</html>
