<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการรักษา</title>
    <link rel="stylesheet" href="styles3.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<header class="header">
  <a href="index2.html" style="text-decoration: none;"> 
  <div class="logo-container">
      <img src="img/11.jpg" alt="logo" class="logo">
      <span class="store-name">คลินิกทันตกรรมแกรนด์สไมล์</span>
    </div> </a>
  <div class="header-user"> <span id="userName"></span></div> 
</header> 
<body>

<div class="container mt-5">
    <h2>ประวัติการรักษา</h2>
    
    <table id="historyTable" class="display table table-striped">
        <thead>
            <tr>
                <th>วันที่</th>
                <th>ชื่อ-สกุล</th>
                <th>ชื่อแพทย์</th>
                <th>รายละเอียด</th>
                <th>ตัวเลือก</th>
            </tr>
        </thead>
        <tbody>
            <!-- ดึงข้อมูลจาก Backend -->
        </tbody>
    </table>
</div>

<script>
$(document).ready(function() {
    loadHistory();
});

// โหลดข้อมูลประวัติการรักษา
function loadHistory() {
    $.get("/get_treatment_history", function(data) {
        let table = $("#historyTable").DataTable();
        table.clear();
        data.history.forEach(record => {
            table.row.add([
                record.date,
                record.patient_name,
                record.doctor_name,
                record.details,
                `<button class="btn btn-info" onclick="viewDetails('${record._id}')">ดูข้อมูล</button>`
            ]).draw();
        });
    });
}

// เปิดหน้าดูรายละเอียด
function viewDetails(id) {
    window.location.href = `/treatment_detail?id=${id}`;
}
</script>

</body>
</html>
